name: Sync CPAC Data

on:
  schedule:
    # Every hour at minute 5. GitHub Actions schedules use UTC.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Do not let a slow sync overlap the next run.
concurrency:
  group: nong-wang-jai-cpac-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on:
      - self-hosted
      - linux
      - x64
      - rmc-prod
      - mapster

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare sync environment
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          if [ -z "$DEPLOY_ENV_FILE" ]; then
            echo "Missing DEPLOY_ENV_FILE secret" >&2
            exit 1
          fi

          sync_env_file="$RUNNER_TEMP/nong-wang-jai-sync-${GITHUB_RUN_ID}.env"
          umask 077
          printf '%s\n' "$DEPLOY_ENV_FILE" > "$sync_env_file"
          printf 'DOTENV_CONFIG_PATH=%s\n' "$sync_env_file" >> "$GITHUB_ENV"
          printf 'SYNC_ENV_FILE=%s\n' "$sync_env_file" >> "$GITHUB_ENV"

      - name: Sync CPAC data to MySQL
        run: npm run sync:db

      - name: Remove sync environment
        if: always()
        run: rm -f -- "$SYNC_ENV_FILE"

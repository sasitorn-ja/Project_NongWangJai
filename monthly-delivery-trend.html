<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แนวโน้มยอดส่งจริงรายเดือน — Nong WangJai</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e6eaef;
    --teal:#1d9e75; --teal-soft:rgba(29,158,117,.12);
    --blue:#378add; --blue-soft:rgba(55,138,221,.12);
    --amber:#ef9f27;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);padding:28px;line-height:1.6}
  .wrap{max-width:1120px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}

  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .titlerow{display:flex;align-items:center;gap:12px}
  .ic{width:38px;height:38px;border-radius:11px;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  h1{font-size:19px;font-weight:600;margin:0}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}

  .seg{display:inline-flex;gap:3px;background:#eef1f4;padding:4px;border-radius:11px}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:7px 15px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

  .legend{display:flex;gap:18px;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .lg .dot{width:11px;height:11px;border-radius:3px}
  .lg.off{opacity:.38;text-decoration:line-through}

  .chartbox{position:relative;height:330px;border:1px solid var(--line);border-radius:12px;padding:14px 10px 6px;background:linear-gradient(180deg,#fbfcfd,#fff)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .stat{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:23px;font-weight:600;margin-top:2px}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:400}
  .stat .meta{font-size:11px;color:var(--muted);margin-top:1px}
  .stat.peak .v{color:var(--teal)}
  .stat.gap .v{color:var(--amber)}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="titlerow">
        <div class="ic">&#128200;</div>
        <div>
          <h1>แนวโน้มยอดส่งจริงรายเดือน</h1>
          <div class="sub">เทียบยอดสั่ง (Ordered) กับยอดส่งจริง (Delivered) — ดูเดือนพีค เดือนเงียบ และช่องว่างที่ยังส่งไม่ครบ</div>
        </div>
      </div>
      <div class="seg" id="seg">
        <button data-r="6">6 เดือน</button>
        <button data-r="12" class="on">12 เดือน</button>
        <button data-r="0">ทั้งหมด</button>
      </div>
    </div>

    <div class="legend">
      <span class="lg" data-s="0"><span class="dot" style="background:var(--teal)"></span>Delivered Volume</span>
      <span class="lg" data-s="1"><span class="dot" style="background:var(--blue)"></span>Ordered Volume</span>
      <span style="margin-left:auto;font-size:12px;color:var(--muted)">คลิกที่ชื่อเพื่อซ่อน/แสดงเส้น</span>
    </div>

    <div class="chartbox"><canvas id="trend" role="img" aria-label="กราฟเส้นแนวโน้มยอดส่งจริงและยอดสั่งรายเดือน"></canvas></div>

    <div class="stats">
      <div class="stat"><div class="k">เดือนล่าสุด</div><div class="v" id="s-last">— <small>m³</small></div><div class="meta" id="s-last-m">—</div></div>
      <div class="stat peak"><div class="k">เดือนพีค</div><div class="v" id="s-peak">— <small>m³</small></div><div class="meta" id="s-peak-m">—</div></div>
      <div class="stat"><div class="k">เฉลี่ย/เดือน</div><div class="v" id="s-avg">— <small>m³</small></div><div class="meta" id="s-avg-m">—</div></div>
      <div class="stat gap"><div class="k">Fill rate (ส่ง/สั่ง)</div><div class="v" id="s-fill">—<small>%</small></div><div class="meta" id="s-fill-m">ช่องว่างที่ยังไม่ส่ง</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const ALL = [
  {m:'มิ.ย. 68',d:42,o:55},{m:'ก.ค. 68',d:58,o:61},{m:'ส.ค. 68',d:47,o:52},
  {m:'ก.ย. 68',d:63,o:70},{m:'ต.ค. 68',d:71,o:74},{m:'พ.ย. 68',d:55,o:68},
  {m:'ธ.ค. 68',d:82,o:85},{m:'ม.ค. 69',d:60,o:72},{m:'ก.พ. 69',d:49,o:58},
  {m:'มี.ค. 69',d:66,o:69},{m:'เม.ย. 69',d:74,o:80},{m:'พ.ค. 69',d:51,o:64}
];
let range=12, hidden=[false,false], chart;

function slice(){ return range===0?ALL:ALL.slice(-range); }
function fmt(n){return Math.round(n).toLocaleString()}

function build(){
  const data=slice();
  const ctx=document.getElementById('trend');
  const grad=ctx.getContext('2d').createLinearGradient(0,0,0,300);
  grad.addColorStop(0,'rgba(29,158,117,.22)');grad.addColorStop(1,'rgba(29,158,117,0)');
  if(chart)chart.destroy();
  chart=new Chart(ctx,{
    type:'line',
    data:{labels:data.map(x=>x.m),datasets:[
      {label:'Delivered',data:data.map(x=>x.d),borderColor:'#1d9e75',backgroundColor:grad,fill:true,tension:.35,borderWidth:2.5,pointRadius:3,pointHoverRadius:6,pointBackgroundColor:'#1d9e75',hidden:hidden[0]},
      {label:'Ordered',data:data.map(x=>x.o),borderColor:'#378add',backgroundColor:'transparent',borderDash:[6,5],fill:false,tension:.35,borderWidth:2,pointRadius:0,pointHoverRadius:5,pointBackgroundColor:'#378add',hidden:hidden[1]}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#0f172a',padding:12,cornerRadius:10,titleFont:{size:13},bodyFont:{size:13},
        callbacks:{label:c=>'  '+c.dataset.label+': '+fmt(c.parsed.y)+' m³'}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eef1f4'},ticks:{color:'#94a3b8',font:{size:12},callback:v=>v+' '}},
        x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:12},autoSkip:false,maxRotation:38}}}
    }
  });
  updateStats(data);
}

function updateStats(data){
  const last=data[data.length-1];
  const peak=data.reduce((a,b)=>b.d>a.d?b:a);
  const avg=data.reduce((s,x)=>s+x.d,0)/data.length;
  const td=data.reduce((s,x)=>s+x.d,0), to=data.reduce((s,x)=>s+x.o,0);
  document.getElementById('s-last').innerHTML=fmt(last.d)+' <small>m³</small>';
  document.getElementById('s-last-m').textContent=last.m;
  document.getElementById('s-peak').innerHTML=fmt(peak.d)+' <small>m³</small>';
  document.getElementById('s-peak-m').textContent=peak.m;
  document.getElementById('s-avg').innerHTML=fmt(avg)+' <small>m³</small>';
  document.getElementById('s-avg-m').textContent=data.length+' เดือน';
  const fill=to?Math.round(td/to*100):0;
  document.getElementById('s-fill').innerHTML=fill+'<small>%</small>';
  document.getElementById('s-fill-m').textContent='ค้างส่ง '+fmt(to-td)+' m³';
}

document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');range=+b.dataset.r;build();
});
document.querySelectorAll('.lg').forEach(el=>el.addEventListener('click',()=>{
  const i=+el.dataset.s;hidden[i]=!hidden[i];el.classList.toggle('off',hidden[i]);build();
}));
build();
</script>
</body>
</html>
